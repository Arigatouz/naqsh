name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          GITHUB_PAGES: "1"
      - name: Collect static site
        run: |
          set -euo pipefail
          rm -rf dist-pages
          if [ -f dist/client/index.html ]; then
            cp -a dist/client dist-pages
          elif [ -f dist/client/_shell.html ]; then
            cp -a dist/client dist-pages
            cp dist/client/_shell.html dist-pages/index.html
          elif [ -f dist/index.html ]; then
            cp -a dist dist-pages
          elif [ -f .output/public/index.html ]; then
            cp -a .output/public dist-pages
          else
            echo "No static index.html found"
            find . -name index.html -not -path './node_modules/*' | head
            exit 1
          fi
          test -f dist-pages/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
